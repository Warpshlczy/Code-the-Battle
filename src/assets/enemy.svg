<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="SENTINEL-07 AI commander">
  <defs>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8eef0"/>
      <stop offset="38%" stop-color="#aebcc2"/>
      <stop offset="72%" stop-color="#6d7b83"/>
      <stop offset="100%" stop-color="#3d484f"/>
    </linearGradient>
    <linearGradient id="ceramicDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9aa9b0"/>
      <stop offset="55%" stop-color="#566369"/>
      <stop offset="100%" stop-color="#2a3339"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16202a"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3d45" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ff2f7d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2f7d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2f7d" stop-opacity="0"/>
      <stop offset="55%" stop-color="#ff3d45" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="panels" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M0 52h28V20h36M20 64V52h22" fill="none" stroke="#8fa0a8" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <ellipse cx="300" cy="260" rx="210" ry="250" fill="url(#redGlow)" opacity="0.28" filter="url(#soft)"/>
  <ellipse cx="430" cy="420" rx="150" ry="240" fill="#38f2cf" opacity="0.05" filter="url(#soft)"/>

  <!-- halo / command ring -->
  <g fill="none" stroke="#ff3d45" filter="url(#glow)" opacity="0.65">
    <circle cx="300" cy="190" r="150" stroke-width="1.6" stroke-dasharray="3 14"/>
    <circle cx="300" cy="190" r="168" stroke-width="1" stroke-dasharray="40 22" opacity="0.6"/>
  </g>
  <g fill="none" stroke="#38f2cf" opacity="0.35">
    <path d="M120 190h-70M550 190h-60" stroke-width="2"/>
    <path d="M90 170v40M570 170v40" stroke-width="2"/>
  </g>

  <!-- back cables -->
  <g fill="none" stroke="#16242c" stroke-width="9">
    <path d="M180 250c-90 70-110 200-60 330s30 170 10 220"/>
    <path d="M420 250c90 70 110 200 60 330s-30 170-10 220"/>
  </g>
  <g fill="none" stroke="#ff2f7d" stroke-width="1.8" opacity="0.45">
    <path d="M180 250c-90 70-110 200-60 330s30 170 10 220"/>
    <path d="M420 250c90 70 110 200 60 330s-30 170-10 220"/>
  </g>

  <!-- neck cables -->
  <g stroke="#0a1016" stroke-width="13" fill="none">
    <path d="M252 238c-10 26-2 44 12 58M348 238c10 26 2 44-12 58"/>
    <path d="M270 244c0 22 8 34 16 44M330 244c0 22-8 34-16 44"/>
  </g>
  <g stroke="#ff3d45" stroke-width="1.4" opacity="0.6" fill="none">
    <path d="M252 238c-10 26-2 44 12 58M348 238c10 26 2 44-12 58"/>
  </g>

  <!-- shoulders -->
  <path d="M168 300l84-34 48 24-40 76-96 26z" fill="url(#ceramic)" stroke="#e9f0f2" stroke-width="2"/>
  <path d="M432 300l-84-34-48 24 40 76 96 26z" fill="url(#ceramic)" stroke="#e9f0f2" stroke-width="2"/>
  <path d="M168 300l-26 20-18 62 44 20 34-64z" fill="url(#ceramicDark)"/>
  <path d="M432 300l26 20 18 62-44 20-34-64z" fill="url(#ceramicDark)"/>
  <path d="M150 340l-20 30 16 16 28-36z" fill="#ff3d45" opacity="0.7" filter="url(#glow)"/>
  <path d="M450 340l20 30-16 16-28-36z" fill="#ff3d45" opacity="0.5" filter="url(#glow)"/>

  <!-- torso -->
  <path d="M246 262h108l36 40 34 240-52 128H228l-52-128 34-240z" fill="url(#under)"/>
  <path d="M252 276c16-14 32-20 48-20s32 6 48 20l20 220-36 104H268l-36-104z" fill="url(#ceramic)" stroke="#dfe8eb" stroke-width="2"/>
  <path d="M300 300v272" stroke="#2d3a41" stroke-width="3" opacity="0.7"/>
  <path d="M252 354l48 26 48-26-12 52-36 18-36-18z" fill="#0a1016" stroke="#ff3d45" stroke-width="2"/>
  <path d="M270 372l30 16 30-16" fill="none" stroke="#ff3d45" stroke-width="3" filter="url(#glow)"/>
  <path d="M258 456h84l-8 94h-68z" fill="#111a22" stroke="#69777f" stroke-width="2"/>
  <g fill="#38f2cf" opacity="0.55">
    <rect x="270" y="470" width="60" height="2"/><rect x="270" y="482" width="40" height="2"/>
    <rect x="270" y="494" width="52" height="2"/>
  </g>
  <path d="M248 590h104l-12 66H260z" fill="url(#ceramicDark)" stroke="#c9d4d8" stroke-width="2"/>
  <g stroke="#ff3d45" stroke-width="2" opacity="0.55">
    <path d="M252 604h96M258 616h84"/>
  </g>

  <!-- arms -->
  <path d="M174 346c-26 44-38 106-36 174l14 118 46 18 22-130-12-166z" fill="url(#ceramicDark)" stroke="#d4dee2" stroke-width="2"/>
  <path d="M426 346c26 44 38 106 36 174l-14 118-46 18-22-130 12-166z" fill="url(#ceramicDark)" stroke="#d4dee2" stroke-width="2"/>
  <!-- arm joints -->
  <g fill="#0b1218" stroke="#ff3d45" stroke-width="1.6">
    <ellipse cx="172" cy="500" rx="24" ry="30"/>
    <ellipse cx="428" cy="500" rx="24" ry="30"/>
  </g>
  <path d="M148 386l10 84 14 2-4-88z" fill="#e8eef0" opacity="0.7"/>
  <path d="M452 386l-10 84-14 2 4-88z" fill="#e8eef0" opacity="0.7"/>
  <g fill="#ff3d45" opacity="0.8" filter="url(#glow)">
    <circle cx="172" cy="500" r="3"/><circle cx="428" cy="500" r="3"/>
  </g>

  <!-- hands / claws -->
  <path d="M148 654l44-8 14 34-20 40-30-6-18-32z" fill="url(#ceramic)" stroke="#dfe8eb" stroke-width="2"/>
  <path d="M452 654l-44-8-14 34 20 40 30-6 18-32z" fill="url(#ceramic)" stroke="#dfe8eb" stroke-width="2"/>
  <g fill="#101920" stroke="#ff3d45" stroke-width="1.2">
    <path d="M156 690l18-14 10 4-10 44-16-6z"/>
    <path d="M444 690l-18-14-10 4 10 44 16-6z"/>
  </g>

  <!-- head -->
  <path d="M244 128l56-34 56 34 14 70-24 54-46 22-46-22-24-54z" fill="url(#under)" stroke="#26343c" stroke-width="3"/>
  <path d="M252 136l48-26 48 26 8 58-18 44-38 18-38-18-18-44z" fill="url(#ceramic)" stroke="#eef4f6" stroke-width="2"/>
  <path d="M260 178l40-8 40 8-10 34-30 12-30-12z" fill="#070b0f"/>
  <path d="M266 186h68" stroke="#ff3d45" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M266 186h68" stroke="#ffb454" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M254 146l30-16 16 8-24 18z" fill="#f3f8f9" opacity="0.9"/>
  <path d="M346 146l-30-16-16 8 24 18z" fill="#bfccd1" opacity="0.9"/>
  <g fill="#ff3d45">
    <circle cx="258" cy="212" r="2.4"/><circle cx="342" cy="212" r="2.4"/>
  </g>
  <path d="M286 232h28" stroke="#5b686f" stroke-width="3"/>
  <!-- antenna -->
  <path d="M300 94v-44" stroke="#87959c" stroke-width="3"/>
  <circle cx="300" cy="46" r="5" fill="#ff3d45" filter="url(#glow)"/>

  <!-- chest emblem -->
  <g transform="translate(300 420)">
    <path d="M0-26L22-13v26L0 26-22 13v-26z" fill="none" stroke="#ff3d45" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
    <path d="M0-12v24M-12 0h24" stroke="#ffb454" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- rim -->
  <path d="M244 128l-18 76 22 54" fill="none" stroke="#38f2cf" stroke-width="3" opacity="0.6" filter="url(#glow)"/>
  <path d="M356 128l18 76-22 54" fill="none" stroke="url(#rimRed)" stroke-width="4" filter="url(#glow)"/>
  <path d="M168 300l-30 70 6 150" fill="none" stroke="#ff3d45" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <path d="M432 300l30 70-6 150" fill="none" stroke="#ffb454" stroke-width="2" opacity="0.4" filter="url(#glow)"/>

  <!-- particles -->
  <g fill="#ff3d45" filter="url(#glow)">
    <circle cx="86" cy="300" r="2"/><circle cx="514" cy="356" r="2"/><circle cx="100" cy="620" r="1.6"/>
    <circle cx="500" cy="660" r="1.8"/>
  </g>
  <g fill="#38f2cf" filter="url(#glow)">
    <circle cx="130" cy="220" r="1.6"/><circle cx="470" cy="210" r="1.4"/>
  </g>
</svg>
