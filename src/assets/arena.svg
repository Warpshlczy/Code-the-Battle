<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Cyber arena background">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#0b2230"/>
      <stop offset="45%" stop-color="#071019"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a22"/>
      <stop offset="100%" stop-color="#03070c"/>
    </linearGradient>
    <linearGradient id="beamCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38f2cf" stop-opacity="0"/>
      <stop offset="55%" stop-color="#38f2cf" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38f2cf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamMagenta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2f7d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2f7d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff2f7d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071018" stop-opacity="0"/>
      <stop offset="100%" stop-color="#03060a" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="platformGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38f2cf" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#38f2cf" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38f2cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.88"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#1d4652" stroke-width="1" opacity="0.32"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#38f2cf" opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>

  <!-- distant server cathedral -->
  <g opacity="0.92">
    <path d="M0 470V180l92-38 74 26 78-58 86 48 70-30 90 52 80-40 76 34 84-58 90 48 74-32 92 44 86-60 88 50 96-36 92 44 60-22v424H0z" fill="#050c12"/>
    <path d="M0 470V250l92-38 74 26 78-58 86 48 70-30 90 52 80-40 76 34 84-58 90 48 74-32 92 44 86-60 88 50 96-36 92 44 60-22v352H0z" fill="url(#tower)" opacity="0.6"/>
    <!-- racks -->
    <g fill="#0a1922" stroke="#173845" stroke-width="2">
      <rect x="96" y="252" width="120" height="300"/>
      <rect x="238" y="210" width="90" height="342"/>
      <rect x="1240" y="226" width="96" height="326"/>
      <rect x="1358" y="268" width="136" height="284"/>
    </g>
    <g fill="#38f2cf" opacity="0.65">
      <rect x="112" y="276" width="88" height="4"/><rect x="112" y="300" width="56" height="3"/>
      <rect x="112" y="332" width="72" height="3"/><rect x="112" y="366" width="40" height="3"/>
      <rect x="254" y="240" width="58" height="3"/><rect x="254" y="268" width="40" height="3"/>
      <rect x="254" y="310" width="62" height="3"/><rect x="254" y="354" width="30" height="3"/>
      <rect x="1256" y="250" width="64" height="3"/><rect x="1256" y="290" width="44" height="3"/>
      <rect x="1374" y="296" width="104" height="3"/><rect x="1374" y="340" width="66" height="3"/>
      <rect x="1374" y="386" width="84" height="3"/>
    </g>
    <g fill="#ff2f7d" opacity="0.8">
      <rect x="112" y="396" width="24" height="3"/><rect x="254" y="390" width="20" height="3"/>
      <rect x="1374" y="424" width="40" height="3"/>
    </g>
    <!-- central arch -->
    <path d="M650 470V300q150-120 300 0v170" fill="none" stroke="#1b4150" stroke-width="14" opacity="0.7"/>
    <path d="M678 470V312q122-96 244 0v158" fill="none" stroke="#38f2cf" stroke-width="2" opacity="0.5" filter="url(#glow)"/>
  </g>

  <!-- hanging light beams -->
  <g filter="url(#soft)" opacity="0.8">
    <rect x="330" y="0" width="60" height="640" fill="url(#beamCyan)"/>
    <rect x="1180" y="0" width="76" height="600" fill="url(#beamMagenta)"/>
  </g>
  <g opacity="0.5">
    <path d="M348 0v556" stroke="#38f2cf" stroke-width="2"/>
    <path d="M1198 0v470" stroke="#ff2f7d" stroke-width="2"/>
  </g>

  <!-- floor perspective -->
  <g opacity="0.7">
    <path d="M0 900L690 470h220L1600 900z" fill="#050b10"/>
    <g stroke="#1d4652" stroke-width="1.4" fill="none">
      <path d="M690 470L-80 900M700 470L200 900M720 470L470 900M760 470L740 900M840 470L860 900M880 470L1130 900M900 470L1400 900M910 470L1680 900"/>
      <path d="M0 560h1600M0 620h1600M0 700h1600M0 800h1600"/>
    </g>
    <g stroke="#ff2f7d" stroke-width="2" opacity="0.35" fill="none">
      <path d="M-40 862h1680"/>
    </g>
  </g>
  <rect y="430" width="1600" height="470" fill="url(#floorFade)" opacity="0.75"/>

  <!-- arena platform -->
  <g>
    <ellipse cx="800" cy="672" rx="470" ry="150" fill="url(#platformGlow)" filter="url(#soft)"/>
    <ellipse cx="800" cy="672" rx="420" ry="128" fill="#060d13" stroke="#1c4a58" stroke-width="4"/>
    <ellipse cx="800" cy="666" rx="368" ry="106" fill="none" stroke="#38f2cf" stroke-width="2.5" opacity="0.8" filter="url(#glow)"/>
    <ellipse cx="800" cy="666" rx="292" ry="82" fill="none" stroke="#2a6b78" stroke-width="1.5" opacity="0.9"/>
    <ellipse cx="800" cy="666" rx="196" ry="54" fill="none" stroke="#38f2cf" stroke-width="1" opacity="0.45"/>
    <g stroke="#38f2cf" opacity="0.32" stroke-width="2">
      <path d="M800 538v256M560 590l480 152M1040 590L560 742"/>
    </g>
    <g fill="#ff2f7d" opacity="0.9">
      <circle cx="432" cy="672" r="5"/><circle cx="1168" cy="672" r="5"/>
      <circle cx="800" cy="544" r="4"/><circle cx="800" cy="794" r="4"/>
    </g>
    <path d="M380 672h840" stroke="#ffb454" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- rain -->
  <g stroke="#9fe8ff" stroke-width="1.4" opacity="0.28">
    <path d="M90 120l-18 96M180 60l-22 120M300 160l-14 74M420 40l-26 138M530 200l-12 62M620 90l-18 96M1010 60l-20 108M1100 180l-14 76M1240 30l-24 130M1360 140l-16 86M1460 70l-20 104M1540 210l-12 64"/>
  </g>
  <g stroke="#ff8fc0" stroke-width="1.2" opacity="0.18">
    <path d="M250 240l-12 64M470 300l-10 54M780 210l-12 66M960 320l-10 52M1300 260l-12 62M1500 380l-8 44"/>
  </g>

  <!-- side fog -->
  <ellipse cx="180" cy="760" rx="300" ry="110" fill="#38f2cf" opacity="0.05" filter="url(#soft)"/>
  <ellipse cx="1430" cy="740" rx="320" ry="120" fill="#ff2f7d" opacity="0.05" filter="url(#soft)"/>

  <rect width="1600" height="900" fill="url(#scan)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
