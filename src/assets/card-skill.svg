<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Skill protocol card art">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#062a2c"/>
      <stop offset="58%" stop-color="#051014"/>
      <stop offset="100%" stop-color="#03070a"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9dfbea" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#38f2cf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b6c70" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#38f2cf" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  <ellipse cx="200" cy="205" rx="160" ry="150" fill="#38f2cf" opacity="0.12" filter="url(#soft)"/>

  <g fill="none" stroke="#38f2cf" opacity="0.45" filter="url(#glow)">
    <circle cx="200" cy="200" r="138" stroke-width="1.4" stroke-dasharray="4 12"/>
    <circle cx="200" cy="200" r="118" stroke-width="1" stroke-dasharray="46 20" opacity="0.6"/>
  </g>

  <!-- shield hex -->
  <g filter="url(#glow)">
    <path d="M200 62l94 54v108l-94 114-94-114V116z" fill="url(#shield)" stroke="#6cffee" stroke-width="2.4"/>
    <path d="M200 88l70 40v82l-70 86-70-86v-82z" fill="none" stroke="#38f2cf" stroke-width="1.2" opacity="0.75"/>
    <path d="M200 118l44 26v52l-44 54-44-54v-52z" fill="none" stroke="#9dfbea" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- circuit traces -->
  <g fill="none" stroke="#38f2cf" stroke-width="2" opacity="0.8">
    <path d="M200 96v-44M200 206v130"/>
    <path d="M126 150l-54-24M274 150l54-24M128 250l-58 34M272 250l58 34"/>
  </g>
  <g fill="none" stroke="#ffb454" stroke-width="1.4" opacity="0.55">
    <path d="M150 178h100M150 202h68M150 226h84"/>
  </g>

  <!-- nodes -->
  <g fill="#38f2cf" filter="url(#glow)">
    <circle cx="200" cy="52" r="3.4"/><circle cx="72" cy="126" r="2.6"/><circle cx="328" cy="126" r="2.6"/>
    <circle cx="70" cy="284" r="2.4"/><circle cx="330" cy="284" r="2.4"/><circle cx="200" cy="336" r="3"/>
  </g>
  <g fill="#ffb454">
    <circle cx="150" cy="178" r="2"/><circle cx="250" cy="226" r="2"/>
  </g>

  <!-- scan sweep -->
  <rect x="86" y="196" width="228" height="2" fill="#9dfbea" opacity="0.55" filter="url(#glow)"/>
  <g stroke="#6cffee" stroke-width="2" opacity="0.5">
    <path d="M28 60V28h32M372 60V28h-32M28 340v32h32M372 340v32h-32"/>
  </g>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#0f3a3e" stroke-width="2"/>
</svg>
