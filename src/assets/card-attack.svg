<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Attack protocol card art">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2a0a16"/>
      <stop offset="60%" stop-color="#0b070c"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2f7d" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#ff5a7f"/>
      <stop offset="70%" stop-color="#ffd0d8"/>
      <stop offset="100%" stop-color="#ffb454"/>
    </linearGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2f7d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="hex" width="44" height="38" patternUnits="userSpaceOnUse">
      <path d="M22 0l18 10v19L22 39 4 29V10z" fill="none" stroke="#ff2f7d" stroke-width="1" opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#hex)"/>
  <ellipse cx="200" cy="210" rx="170" ry="140" fill="#ff2f7d" opacity="0.12" filter="url(#soft)"/>

  <!-- frame rings -->
  <g fill="none" stroke="#ff2f7d" opacity="0.5" filter="url(#glow)">
    <circle cx="200" cy="200" r="132" stroke-width="1.4" stroke-dasharray="70 18 12 18"/>
    <circle cx="200" cy="200" r="108" stroke-width="1" opacity="0.5"/>
  </g>
  <g stroke="#ffb454" stroke-width="1.5" opacity="0.35">
    <path d="M40 200h42M318 200h42M200 40v30M200 330v30"/>
  </g>

  <!-- slash -->
  <g transform="rotate(-38 200 200)">
    <path d="M-30 214L250 150l96 22-236 74z" fill="url(#blade)" filter="url(#glow)"/>
    <path d="M-20 208L300 158" stroke="#fff2f4" stroke-width="3" opacity="0.85"/>
    <path d="M80 262L330 202" stroke="#ff2f7d" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- impact shards -->
  <g fill="url(#shard)" stroke="#ff5a7f" stroke-width="1">
    <path d="M250 120l36-14-8 34-24 10z"/>
    <path d="M300 230l30 4-16 28-22-6z"/>
    <path d="M120 300l26-12 8 26-24 12z"/>
    <path d="M82 160l22-18 12 24-20 14z"/>
    <path d="M320 110l18-24 10 26-16 14z"/>
  </g>
  <g fill="#ffb454" filter="url(#glow)">
    <circle cx="252" cy="128" r="2.6"/><circle cx="308" cy="238" r="2.2"/>
    <circle cx="136" cy="302" r="2"/><circle cx="92" cy="166" r="1.8"/>
  </g>

  <!-- blade core -->
  <g transform="translate(210 220) rotate(-38)">
    <path d="M0-90L16-10 0 74-16-10z" fill="#ffd7de" opacity="0.85" filter="url(#glow)"/>
    <path d="M0-70v120" stroke="#fff" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- edge ticks -->
  <g stroke="#ff2f7d" stroke-width="2" opacity="0.6">
    <path d="M24 60v-20M376 60v-20M24 340v20M376 340v20"/>
  </g>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#3a1a28" stroke-width="2"/>
</svg>
